name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 159.223.189.172
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Kalshi-bot
            git pull
            npm run build
            pm2 delete bot dashboard guardian telegram 2>/dev/null; true
            pm2 start dist/bot.js --name bot
            pm2 start dist/dashboard.js --name dashboard
            pm2 start dist/guardian.js --name guardian
            pm2 start dist/telegram.js --name telegram